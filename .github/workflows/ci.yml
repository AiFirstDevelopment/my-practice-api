name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a branch makes the run already in flight for it pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is what the image runs; 20 is what the repo's engines field still
        # allows. Drop 20 here and from package.json together.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # ci, not install: fails on a package-lock.json that has drifted from
      # package.json instead of quietly rewriting it.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built and smoke-tested, not pushed — wire up a registry login and
      # push: true here when there is somewhere to deploy it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: my-practice-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name api -p 3000:3000 my-practice-api:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3000/healthz; then
              echo "healthy"
              exit 0
            fi
            sleep 1
          done
          echo "never became healthy"
          docker logs api
          exit 1

      - name: Container logs
        if: always()
        run: docker logs api || true
